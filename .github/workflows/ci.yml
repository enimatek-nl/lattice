name: ci

# The gate this project actually claims. `make verify` is gofmt + go vet + race tests,
# and the records in .agent-work/ cite those runs, so CI runs the same three things on
# every push and pull request. A claim about tests passing that no machine re-checks is
# a claim that rots: this file is what stops the docs and the tree from drifting apart
# between a commit and the next release.
#
# Complement is not run here on purpose. It needs a container runtime, a Complement
# checkout and about ten minutes of two-homeserver traffic, and its tally is a project
# record kept in docs/compliance-matrix.md with its run logs under .agent-work/, not a
# per-commit pass/fail. scripts/complement.sh is the way to run it.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.26"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: gofmt
        run: |
          unformatted=$(gofmt -l $(find . -name '*.go'))
          if [ -n "$unformatted" ]; then
            echo "these files are not gofmt-clean:"; echo "$unformatted"; exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: golangci-lint
        # Installed from the Go module proxy rather than with golangci/golangci-lint-action.
        #
        # The action is a fine way to run a linter, and it was the way here until it started
        # failing the job with `Unexpected HTTP response: 504` from inside its own run step: the
        # action talks to the GitHub API and to github.com/…/releases during a build — to resolve
        # and verify the version it is asked to install — and that makes whether this repository
        # passes CI depend on a second service being healthy. Those calls are not incidental and
        # cannot be switched off in a way that keeps the version pinning, so the pipeline no longer
        # makes them. `go install` reaches the module proxy, which is the same place the build
        # already gets everything, and the binary lands in the Go module cache that setup-go warms.
        #
        # The version stays pinned, not "latest": a linter release that turns on a new check would
        # otherwise make an unrelated commit red, and the fix would be a guess about which rule
        # changed. The retry is for a proxy hiccup, not for the linter's verdict — a real finding
        # still fails the step, on the last attempt like the first.
        run: |
          for attempt in 1 2 3; do
            if go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0; then
              break
            fi
            if [ "$attempt" = 3 ]; then exit 1; fi
            echo "golangci-lint could not be installed (attempt $attempt), retrying" >&2
            sleep 5
          done
          "${HOME}/go/bin/golangci-lint" run --timeout=5m

      - name: race tests
        run: go test -race -count=1 -timeout 15m ./tests/...

      - name: build
        run: go build -o bin/lattice ./cmd/lattice && ./bin/lattice version
